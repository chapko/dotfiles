[accessibility]
ui_scale = 1.20

[bar.default]
start = ["launcher", "workspaces", "spacer_1", "active_window"]
center = ["clock", "bar", "bar_2", "spacer_1", "group:g1"]
end = [
  "media",
  "spacer_1",
  "tray",
  "spacer_1",
  "keyboard_layout",
  "notifications",
  "network",
  "volume",
  "spacer_1",
  "session",
]
thickness = 32
concave_edge_corners = true
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10

[[bar.default.capsule_group]]
accordion = false
enabled = true
border = ""
fill = "on_primary"
id = "g1"
members = ["temp", "sysmon_2", "sysmon_3"]
opacity = 1.0
padding = 6.0

[nightlight]
enabled = true
force = true
temperature_day = 3500
temperature_night = 3500

[osd]
offset_y = 100
position = "bottom_center"

[osd.kinds]
media = false

[plugins]
enabled = ["noctalia/world_clock"]

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

[shell.greeter_sync]
auto_sync = false

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[shell.screenshot]
copy_to_clipboard = false
pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
pipe_to_command = true
save_to_file = false

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 3.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 3.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
enabled = true
shortcut = "5"
variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Noctalia"
community_palette = "ADW"
custom_palette = "personal"
mode = "light"
source = "custom"
wallpaper_scheme = "m3-monochrome"

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "qt"]

[widget.active_window]
max_length = 800
min_length = 800

[widget.bar]
color = "secondary"
type = "noctalia/world_clock:bar"

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.keyboard_layout]
color = "secondary"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"
show_label = false

[widget.notifications]
color = "secondary"

[widget.session]
color = "primary"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"
capsule_padding = 8
hide_passive = false

[widget.volume]
color = "secondary"
show_label = false

[widget.workspaces]
active_pill_size = 1.5
capsule = true
capsule_fill = "on_primary"
empty_color = "tertiary"
occupied_color = "tertiary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false
